apiVersion: v1
kind: Service
metadata:
  name: web-app-service
  labels:
    app: web-app
spec:
  type: ClusterIP # Hanya diakses secara internal di dalam klaster, dihubungkan lewat Ingress nanti
  ports:
  - port: 80 # Port yang dibuka oleh Service
    targetPort: 8080 # Port yang dijalankan di dalam kontainer web-app Anda
    protocol: TCP
  selector:
    app: web-app

---
apiVersion: v1
kind: Service
metadata:
  name: database-service
  labels:
    app: database
spec:
  type: ClusterIP # Database hanya boleh diakses oleh aplikasi di dalam klaster demi keamanan
  ports:
  - port: 3306 # Port standar MySQL
    targetPort: 3306
    protocol: TCP
  selector:
    app: database
